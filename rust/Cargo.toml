[package]
name = "prism_core"
version = "0.1.0"
edition = "2021"
description = "Thread-safe Rust browser core providing Layer 2 document-start capture shim, HTTP Permissions-Policy header stripping, and tab metadata management for Prism Android."

[lib]
name = "prism_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
