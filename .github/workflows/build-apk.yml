name: Build Prism Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --install "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> $GITHUB_ENV

      - name: Set up Rust toolchain with Android arm64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run Rust unit tests
        working-directory: rust
        run: cargo test

      - name: Build Rust core (arm64-v8a with 16 KB ELF page alignment)
        working-directory: rust
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: |
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug -PrequireRust=true --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
